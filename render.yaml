# Free evaluation deployment. The database expires 30 days after creation.
services:
  - type: web
    name: crisp-backend
    runtime: docker
    plan: free
    repo: https://github.com/Rfxan/CRISP
    branch: main
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CRISP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_DOTENV_DISABLED
        value: "1"
      - key: CRISP_DATABASE_URL
        fromDatabase:
          name: crisp-postgres
          property: connectionString
      - key: CRISP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: crisp-postgres
    plan: free
    postgresMajorVersion: "18"
    databaseName: crisp
    user: crisp
    ipAllowList: []
