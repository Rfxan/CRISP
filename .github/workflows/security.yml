name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: '1'
      CRISP_ENV: development
      CRISP_TESTING: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=low
      - run: npm --prefix frontend run build
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1 bandit==1.9.4
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m bandit -r backend/app --severity-level high --confidence-level medium
      - run: python -m pytest backend/tests -q
